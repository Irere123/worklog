name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push to the same branch makes an older run moot; main's runs all finish, since each
# one publishes an image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, so commitlint can read every commit in a PR.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Commit messages follow Conventional Commits
        if: github.event_name == 'pull_request'
        run: >-
          bun --bun commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - name: Colours meet contrast targets
        run: bun run --filter @worklog/web contrast
      - name: Web app builds
        run: bun run --filter @worklog/web build

  images:
    name: Images build, start and serve together
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        # A throwaway database reached only from this job, so no password.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: worklog
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/worklog
      PUBLIC_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: API image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          load: true
          tags: worklog-api:ci
          build-args: WORKLOG_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Worker image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: worker
          load: true
          tags: worklog-worker:ci
          build-args: WORKLOG_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=api
      - name: Web image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: worklog-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Production refuses to start without its secrets
        run: |
          if docker run --rm -e NODE_ENV=production -e DATABASE_URL worklog-api:ci 2> stderr.txt; then
            echo "started without WORKLOG_SECRET_KEY, AUTH_SECRET and PUBLIC_URL" >&2
            exit 1
          fi
          grep -q "required in production" stderr.txt
      - name: Secrets for this run
        run: |
          echo "WORKLOG_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Migrations run on their own
        run: >-
          docker run --rm --network host -e DATABASE_URL -e WORKLOG_SECRET_KEY -e AUTH_SECRET -e PUBLIC_URL worklog-api:ci bun scripts/migrate.ts
      - name: API, worker and web start and report healthy
        run: |
          backend="-e DATABASE_URL -e WORKLOG_SECRET_KEY -e AUTH_SECRET -e PUBLIC_URL"
          docker run -d --name api --network host $backend -e RUN_SCHEDULER=false worklog-api:ci
          docker run -d --name worker --network host $backend worklog-worker:ci
          docker run -d --name web --network host -e API_UPSTREAM=127.0.0.1:4000 worklog-web:ci
          for container in api worker web; do
            for _ in $(seq 60); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' $container)" = healthy ] && break
              sleep 2
            done
            echo "$container: $(docker inspect -f '{{.State.Health.Status}}' $container)"
            [ "$(docker inspect -f '{{.State.Health.Status}}' $container)" = healthy ]
          done
      - name: The web app and the API answer through the web server
        run: |
          site=http://127.0.0.1:8080
          curl -fsS http://127.0.0.1:4000/health | grep -q '"release":"${{ github.sha }}"'
          curl -fsS http://127.0.0.1:4001/health | grep -q '"db":true'
          curl -fsS $site/ | grep -qi '<!doctype html>'
          curl -fsS $site/board/12 | grep -qi '<!doctype html>'
          [ "$(curl -s -o /dev/null -w '%{http_code}' $site/assets/gone-0000.js)" = 404 ]
          asset=$(curl -fsS $site/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -fsSI -H 'accept-encoding: br' "$site$asset" | grep -qi '^content-encoding: br'
          curl -fsSI "$site$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          [ "$(curl -s -o /dev/null -w '%{http_code}' $site/v1/me)" = 401 ]
          token=$(curl -fsS -X POST $site/v1/setup -H 'content-type: application/json' \
            -d '{"workspaceName":"CI","name":"Ana","email":"ana@example.com"}' | jq -r .token.token)
          # An event stream must reach the browser as it's written, not when the proxy's buffer fills.
          timeout 5 curl -sN "$site/v1/events?token=$token" > events.txt || true
          grep -q "server.connected" events.txt
      - name: The web server serves HTTPS itself, as its own user
        run: |
          # Its health check port is the plain one's too.
          docker stop web
          docker run -d --name web-https --network host -e SITE_ADDRESS=localhost \
            -e API_UPSTREAM=127.0.0.1:4000 worklog-web:ci
          for _ in $(seq 30); do curl -fsSk https://localhost/health && break; sleep 1; done
          curl -fsSk https://localhost/ | grep -qi '<!doctype html>'
          [ "$(docker exec web-https id -un)" = web ]
          docker rm -f web-https
      - name: Each stops within its grace period
        run: |
          start=$(date +%s)
          docker stop --time 30 web api worker
          [ $(( $(date +%s) - start )) -lt 30 ]
          for container in api worker; do
            [ "$(docker inspect -f '{{.State.ExitCode}}' $container)" = 0 ]
          done
      - name: Logs
        if: failure()
        run: |
          for container in api worker web web-https; do
            echo "::group::$container"; docker logs $container 2>&1 || true; echo "::endgroup::"
          done
      - name: Compose files are valid
        run: |
          cp .env.compose.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.https.yaml config --quiet

  publish:
    name: Publish ${{ matrix.image }} image
    needs: [check, images]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            file: apps/api/Dockerfile
            target: api
            cache: api
          - image: worker
            file: apps/api/Dockerfile
            target: worker
            cache: api
          - image: web
            file: apps/web/Dockerfile
            target: web
            cache: web
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/worklog-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WORKLOG_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache }}
